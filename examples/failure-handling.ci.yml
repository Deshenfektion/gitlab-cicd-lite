stages:
  - build
  - verify

jobs:
  build:
    stage: build
    image: alpine:3.20
    script:
      - echo "building"

  flaky:
    stage: verify
    image: alpine:3.20
    needs: [build]
    retry: 2
    script:
      - echo "this job always fails"
      - exit 1

  tolerated:
    stage: verify
    image: alpine:3.20
    needs: [build]
    allow_failure: true
    script:
      - exit 7

  slow:
    stage: verify
    image: alpine:3.20
    needs: [build]
    timeout: 2s
    script:
      - sleep 30
